trigger:

- master


pool:

vmImage: 'ubuntu-24.04'


variables:

buildConfiguration: 'Release'


stages:

- stage: Build

displayName: Build

jobs:

- job: Build

displayName: Build and test

steps:

- task: UseDotNet@2

inputs:

packageType: 'sdk'

version: '8.x'


- task: DotNetCoreCLI@2

displayName: Restore

inputs:

command: 'restore'

projects: '**/*.csproj'


- task: DotNetCoreCLI@2

displayName: Build

inputs:

command: 'build'

projects: '**/*.csproj'

arguments: '--configuration $(buildConfiguration) --no-restore'


- task: DotNetCoreCLI@2

displayName: Publish

inputs:

command: 'publish'

publishWebProjects: true

arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

zipAfterPublish: true


- publish: $(Build.ArtifactStagingDirectory)

artifact: drop

displayName: Publish artifact


- stage: Deploy

displayName: Deploy

dependsOn: Build

condition: succeeded()

jobs:

- deployment: Deploy

displayName: Deploy to dev

pool:

vmImage: 'ubuntu-24.04'

environment: 'dev'

strategy:

runOnce:

deploy:

steps:

- download: current

artifact: drop

- script: echo "Deploying $(Pipeline.Workspace)/drop ..."

displayName: Deploy (placeholder)